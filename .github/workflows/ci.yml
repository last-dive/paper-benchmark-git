name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install PDF system tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Check files prepared for Git
        run: python3 tools/check_repo.py
      - name: Run application tests without model or GPU calls
        run: python3 run_tests.py
